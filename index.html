<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verdikt — Teacher Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <div class="app-layout">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <div class="logo-icon">
          <i data-lucide="terminal" class="icon-void icon-sm"></i>
        </div>
        <span class="logo-text sidebar-label">Verdikt</span>
      </div>

      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-page="dashboard">
          <i data-lucide="layout-dashboard" class="nav-icon"></i>
          <span class="sidebar-label">Dashboard</span>
        </a>
        <a href="#" class="nav-item" data-page="assignments">
          <i data-lucide="file-code-2" class="nav-icon"></i>
          <span class="sidebar-label">Assignments</span>
        </a>
        <a href="#" class="nav-item" data-page="create">
          <i data-lucide="plus-circle" class="nav-icon"></i>
          <span class="sidebar-label">Create New</span>
        </a>
        <a href="#" class="nav-item" data-page="plagiarism">
          <i data-lucide="shield" class="nav-icon"></i>
          <span class="sidebar-label">Plagiarism Logs</span>
        </a>
        <a href="#" class="nav-item" data-page="submissions">
          <i data-lucide="clipboard-list" class="nav-icon"></i>
          <span class="sidebar-label">Submissions</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-info sidebar-label">
          <p class="user-name">Dr. Sarah Chen</p>
          <p class="user-role">Teacher</p>
        </div>
        <button class="logout-btn" onclick="alert('Logging out...')">
          <i data-lucide="log-out" class="nav-icon"></i>
          <span class="sidebar-label">Sign Out</span>
        </button>
        <button class="collapse-btn" id="collapse-btn" title="Toggle sidebar">
          <i data-lucide="chevron-left" id="collapse-icon" class="icon-sm"></i>
        </button>
      </div>
    </aside>
